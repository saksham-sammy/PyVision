<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyVision | Python Semester Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans h-screen flex flex-col overflow-hidden selection:bg-yellow-500/30">

    <!-- Header / Navbar -->
    <nav class="border-b border-slate-800/60 bg-slate-950/80 backdrop-blur-md shrink-0 h-14 flex items-center justify-between px-4 sm:px-6">
        <div class="flex items-center gap-3">
            <img src="logo.svg" alt="PyVision Logo" class="w-8 h-8 rounded-lg object-cover shadow-lg shadow-sky-500/20">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-lg font-bold text-white leading-tight">PyVision</h1>
                    <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-yellow-500/10 text-yellow-500 border border-yellow-500/20 tracking-wider">SEM 3</span>
                </div>
                <p class="text-[10px] text-sky-400 font-bold uppercase tracking-widest">By Saksham Sharma</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="hidden md:flex items-center gap-1.5">
                <a href="https://saksham-personalportfolio.vercel.app" target="_blank" rel="noopener" class="text-[11px] font-semibold text-sky-400 hover:text-sky-300 bg-sky-500/10 hover:bg-sky-500/20 px-2.5 py-1 rounded-md border border-sky-500/25 transition-all">
                    Portfolio I
                </a>
                <a href="https://sakshamsharmaportfolio.vercel.app" target="_blank" rel="noopener" class="text-[11px] font-semibold text-yellow-400 hover:text-yellow-300 bg-yellow-500/10 hover:bg-yellow-500/20 px-2.5 py-1 rounded-md border border-yellow-500/25 transition-all">
                    Portfolio II
                </a>
            </div>
            <button onclick="runCode()" class="bg-[#FFD43B] hover:bg-[#F2C934] text-slate-900 font-bold py-1.5 px-4 rounded-md transition-all shadow-lg shadow-yellow-500/20 flex items-center gap-2 text-sm transform active:scale-95">
                <i class="ph-fill ph-play"></i> Run Code
            </button>
        </div>
    </nav>

    <!-- Main Workspace -->
    <main class="flex-grow flex overflow-hidden">
        
        <!-- Sidebar File Explorer -->
        <aside class="w-64 border-r border-slate-800/60 bg-slate-900/30 flex flex-col shrink-0">
            <div class="p-3 border-b border-slate-800/60 flex items-center justify-between">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Explorer</span>
                <button onclick="loadFiles()" class="text-slate-500 hover:text-slate-300 transition-colors">
                    <i class="ph ph-arrows-clockwise text-sm"></i>
                </button>
            </div>
            <div class="overflow-y-auto flex-1 custom-scrollbar p-2" id="file-tree">
                <!-- Dynamically populated by JS -->
                <div class="text-center p-4 text-slate-500 text-sm">Loading files...</div>
            </div>
            <div class="p-3 border-t border-slate-800/60 bg-slate-900/60 text-center text-xs text-slate-400">
                <span class="text-slate-500">Built by</span> <span class="text-sky-400 font-semibold">Saksham Sharma</span>
            </div>
        </aside>

        <!-- Editor & Terminal Area -->
        <div class="flex-1 flex flex-col min-w-0">
            
            <!-- Editor Top Bar -->
            <div class="h-10 border-b border-slate-800/60 bg-slate-900/50 flex items-center px-4 justify-between shrink-0">
                <div class="flex items-center gap-2 text-sm text-slate-300 font-medium" id="current-file-name">
                    <i class="ph ph-file-code text-yellow-500"></i> No file selected
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-500 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">Python 3.10+</span>
                </div>
            </div>

            <!-- Code Editor -->
            <div class="flex-1 relative bg-[#0d1117] overflow-hidden">
                <!-- Line numbers and text area -->
                <div class="absolute inset-0 flex">
                    <div id="line-numbers" class="w-12 bg-slate-900/80 border-r border-slate-800/60 text-right pr-2 pt-4 text-xs font-mono text-slate-500 select-none overflow-hidden pb-4">
                        1
                    </div>
                    <textarea id="code-editor" class="flex-1 custom-scrollbar bg-transparent border-none p-4 text-sm font-mono text-slate-300 focus:outline-none resize-none whitespace-pre leading-relaxed tab-size-4" spellcheck="false" placeholder="# Select a Python file from the sidebar..."></textarea>
                </div>
            </div>

            <!-- Resizer -->
            <div class="h-1 bg-slate-800/80 cursor-ns-resize hover:bg-blue-500/50 transition-colors shrink-0"></div>

            <!-- Terminal output -->
            <div class="h-64 flex flex-col bg-[#0d1117] border-t border-slate-800/60 shrink-0">
                <div class="h-10 border-b border-slate-800/60 bg-slate-900/80 flex items-center px-4 justify-between shrink-0">
                    <div class="flex items-center gap-4">
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                            <i class="ph ph-terminal"></i> Terminal Output
                        </span>
                        <input type="text" id="stdin-input" placeholder="Program Input (stdin, use \n for newlines)..." class="bg-[#0d1117] border border-slate-700/50 text-xs text-slate-300 px-3 py-1.5 rounded-md w-72 focus:outline-none focus:border-blue-500/50 placeholder-slate-600">
                    </div>
                    <button onclick="clearTerminal()" class="text-xs text-slate-500 hover:text-rose-400 transition-colors">Clear</button>
                </div>
                <div class="flex-1 p-4 overflow-y-auto custom-scrollbar font-mono text-sm">
                    <pre id="terminal-output" class="text-slate-300 whitespace-pre-wrap leading-relaxed"><span class="text-slate-500">PyVision Virtual Environment Initialized. Ready.</span></pre>
                </div>
            </div>

        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
